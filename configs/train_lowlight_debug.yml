# Debug training config for TA Low-Light dataset
# Purpose: small run to check paths, dataloader, model, loss, validation, and checkpoint saving.

name: lowlight_nafnet_debug
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: lowlight_train_debug
    type: PairedImageDataset
    dataroot_gt: /content/nafnet_data/train/gt
    dataroot_lq: /content/nafnet_data/train/lq
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: lowlight_val
    type: PairedImageDataset
    dataroot_gt: /content/nafnet_data/val/gt
    dataroot_lq: /content/nafnet_data/val/lq
    io_backend:
      type: disk

network_g:
  type: NAFNet
  img_channel: 3
  width: 16
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1, 1]
  dec_blk_nums: [1, 1, 1, 1]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 1000
  warmup_iter: -1

  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [1000]
    restart_weights: [1]
    eta_mins: [!!float 1e-7]

  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

val:
  val_freq: 200
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 50
  save_checkpoint_freq: 500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500