name: LowLight-NAFNet-width32-test
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  val:
    name: LowLight_val
    type: PairedImageDataset
    dataroot_gt: ./datasets/val
    dataroot_lq: ./datasets/val
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: NAFNet
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

path:
  pretrain_network_g: ./experiments/LowLight-NAFNet-width32/models/net_g_1000.pth
  strict_load_g: true
  resume_state: ~

val:
  save_img: true
  grids: false
  use_image: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

dist_params:
  backend: nccl
  port: 29500